name: Ultimate PPL
routine:
  - exercises:
      - name: squat
        notes: |
          Sit back and down, keep your upper back tight to the bar.
        reps:
          max: 4
          min: 2
        rest:
          max: 4
          min: 3
        rpe:
          max: 9
          min: 8
        sets:
          - count:
              max: 4
              min: 3
            type: warm-up
          - count:
              max: 1
              min: 1
            type: working
        substitutions:
          - hackSquat
          - dumbbellRomanianDeadlift
    name: |
      Legs #1
  - exercises:
      - name: benchPress
        reps:
          max: 5
          min: 3
        rest:
          max: 4
          min: 3
        rpe:
          max: 9
          min: 8
        sets:
          - count:
              max: 1
              min: 1
            type: working
          - count:
              max: 4
              min: 3
            type: warm-up
        substitutions:
          - dumbbellBenchPress
          - machineChestPress
    name: |
      Push #1
  - exercises:
      - name: latPulldown
        reps:
          max: 10
          min: 10
        rest:
          max: 3
          min: 2
        rpe:
          max: 0
          min: 0
        sets:
          - count:
              max: 4
              min: 4
            type: feeder
        substitutions:
          - machinePulldown
          - pullUp
      - name: latPulldown
        reps:
          max: 10
          min: 10
        rest:
          max: 3
          min: 2
        rpe:
          max: 10
          min: 10
        sets:
          - count:
              max: 1
              min: 1
            type: fail
        substitutions:
          - machinePulldown
          - pullUp
    name: |
      Pull #1
  - exercises:
      - name: deadlift
        reps:
          max: 5
          min: 5
        rest:
          max: 5
          min: 3
        rpe:
          max: 9
          min: 8
        sets:
          - count:
              max: 4
              min: 3
            type: warm-up
          - count:
              max: 1
              min: 1
            type: working
        substitutions:
          - trapBarDeadlift
          - barbellHipThrust
    name: |
      Full Body #1
